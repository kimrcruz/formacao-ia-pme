<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4EFE4">
<title>O que falta?</title>
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;-webkit-text-size-adjust:100%}
img{max-width:100%}
[hidden]{display:none!important}
.back{display:inline-block;font:700 13px/1 Arial,Helvetica,sans-serif;letter-spacing:.06em;color:#1B3A2D;text-decoration:none;border-bottom:1.5px solid #8AA08D;padding-bottom:3px;margin-bottom:6px}

  :root {
    --cream: #F4EFE4;
    --paper: #FBF8F1;
    --forest: #1B3A2D;
    --sage: #8AA08D;
    --ink: #262626;
    --soft: #E9E2D2;
    --red: #A4452F;
    --muted: #5E6B61;
    --serif: Georgia, "Times New Roman", "Noto Serif", serif;
    --sans: Arial, "Helvetica Neue", Helvetica, "Roboto", sans-serif;
  }
  html, body { background: var(--cream); color: var(--ink); }
  body { font-family: var(--sans); font-size: 16px; line-height: 1.5; padding-inline: 16px; padding-block: 20px 32px; }
  .wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }

  .kicker { font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--forest); }
  h1 { font-family: var(--serif); font-size: 34px; line-height: 1.1; color: var(--forest); margin: 4px 0 0; text-wrap: balance; }
  .lead { margin: 6px 0 0; }

  .progress { display: flex; align-items: center; gap: 10px; }
  .bars { flex: 1; display: grid; gap: 4px; }
  .bars i { height: 6px; background: var(--soft); border: 1px solid var(--sage); }
  .bars i.ok { background: var(--forest); border-color: var(--forest); }
  .bars i.ko { background: var(--red); border-color: var(--red); }
  .bars i.now { border-color: var(--forest); border-width: 2px; }
  .count { font-size: 13px; font-weight: 700; color: var(--forest); font-variant-numeric: tabular-nums; white-space: nowrap; }

  .card { background: var(--paper); border: 1px solid var(--sage); padding: 18px 18px 20px; display: flex; flex-direction: column; gap: 16px; }
  .label { font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .prompt { font-family: var(--serif); font-style: italic; font-size: 20px; line-height: 1.4; color: var(--forest); margin: 6px 0 0; }

  .ask { font-weight: 700; color: var(--forest); margin: 0; }
  .toggles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .tog { font: 700 13px/1.2 var(--sans); letter-spacing: .08em; padding: 14px 4px; min-height: 64px; background: var(--cream); color: var(--forest); border: 1.5px solid var(--forest); cursor: pointer; -webkit-tap-highlight-color: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
  .tog small { font-weight: 400; letter-spacing: 0; font-size: 12px; color: var(--muted); }
  .tog[aria-pressed="true"] { background: var(--forest); color: var(--cream); }
  .tog[aria-pressed="true"] small { color: var(--cream); }
  .none { grid-column: 1 / -1; min-height: 48px; flex-direction: row; }
  .tog:disabled { cursor: default; }
  .tog:focus-visible, .btn:focus-visible { outline: 3px solid var(--sage); outline-offset: 2px; }

  .btn { font: 700 17px/1 var(--sans); padding: 16px; min-height: 54px; width: 100%; background: var(--forest); color: var(--cream); border: 0; cursor: pointer; }
  .btn:disabled { opacity: .35; cursor: default; }
  .btn.ghost { background: transparent; color: var(--forest); border: 1.5px solid var(--forest); }

  .feedback { border-top: 1px solid var(--sage); padding-top: 16px; display: flex; flex-direction: column; gap: 12px; }
  .verdict { font-family: var(--serif); font-weight: 700; font-size: 22px; color: var(--forest); margin: 0; }
  .verdict.wrong { color: var(--red); }
  .blocks { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .block { border: 1px solid var(--sage); padding: 8px 6px; text-align: center; }
  .block b { display: block; font-size: 11px; letter-spacing: .12em; color: var(--forest); }
  .block span { display: block; font-size: 14px; margin-top: 2px; }
  .block.tem { background: var(--forest); border-color: var(--forest); }
  .block.tem b, .block.tem span { color: var(--cream); }
  .block.falta { border-color: var(--red); border-width: 1.5px; }
  .block.falta span { color: var(--red); font-weight: 700; }
  .mine { font-size: 14px; color: var(--muted); margin: 0; }
  .why { margin: 0; }
  .fix { border-left: 3px solid var(--forest); padding: 8px 0 8px 12px; }
  .fix .label { color: var(--forest); }
  .fix p { font-family: var(--serif); font-style: italic; color: var(--forest); margin: 4px 0 0; }

  .score { font-family: var(--serif); font-size: 56px; line-height: 1; color: var(--forest); margin: 0; font-variant-numeric: tabular-nums; }
  .score small { font-size: 24px; color: var(--muted); }
  .end-msg { font-family: var(--serif); font-size: 20px; color: var(--forest); margin: 0; }
  .recap { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--sage); }
  .recap li { display: grid; grid-template-columns: 24px 1fr; gap: 8px; padding: 10px 0; border-bottom: 1px solid var(--sage); font-size: 14px; }
  .recap .n { font-family: var(--serif); font-weight: 700; color: var(--sage); }
  .recap .a { display: block; margin-top: 2px; font-weight: 700; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
  .recap .a.ok { color: var(--forest); }
  .recap .a.ko { color: var(--red); }

  footer { font-size: 12px; color: var(--muted); border-top: 1px solid var(--sage); padding-top: 10px; }

  @media (prefers-reduced-motion: no-preference) {
    .feedback, .card.end { animation: in .25s ease-out; }
    @keyframes in { from { opacity: .3; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="./">‹ Todos os exercícios</a>
  <header>
    <div class="kicker">IA Lab · Lição 1 · Pedir melhor</div>
    <h1>O que falta?</h1>
    <p class="lead">Sete pedidos da Pastelaria Acácia. Em cada um, toca nos blocos que faltam. Às vezes falta mais do que um. Às vezes não falta nada.</p>
  </header>

  <div class="progress">
    <div class="bars" id="bars"></div>
    <div class="count" id="count"></div>
  </div>

  <main id="stage"></main>

  <footer>A Pastelaria Acácia é um negócio fictício. Esta página não guarda as tuas respostas.</footer>
</div>

<script>
// miss: blocos que faltam, na ordem T, C, E
const Q = [
  { p: "A cliente reclamou que o bolo chegou às 13h em vez das 10h. Ainda estamos a confirmar com o motorista. Até cinco linhas, tom cordial, não prometas reembolso.",
    miss: ["T"],
    why: "Ele sabe o que aconteceu e como deve ficar. Não sabe o que fazer: responder à cliente, resumir para ti ou escrever ao motorista?",
    fix: "Responde a esta reclamação pelo WhatsApp." },
  { p: "A Dona Célia encomendou um bolo de aniversário para sábado às 15h. Quer mudar o sabor para chocolate.",
    miss: ["T", "E"],
    why: "É só contexto. Ele não sabe se deve confirmar a mudança, calcular a diferença de preço ou escrever à cliente, nem em que formato.",
    fix: "Escreve à cliente a confirmar a mudança. Duas linhas, sem mexer no preço." },
  { p: "Escreve uma mensagem de WhatsApp a lembrar os clientes das encomendas de Natal. Até três linhas, tom próximo, termina com a data limite.",
    miss: ["C"],
    why: "Pede a data limite sem dizer qual é. Ele escolhe uma, por exemplo 20 de Dezembro, quando a tua agenda fecha a 15.",
    fix: "A agenda fecha a 15 de Dezembro. Não fazemos entregas no dia 25." },
  { p: "Traduz para inglês esta mensagem de boas-vindas. É para um cliente estrangeiro que encomendou pelo Instagram. Mantém o tom próximo e não passes de três linhas. [mensagem colada aqui]",
    miss: [],
    why: "Tem tarefa (traduzir), contexto (quem é o cliente, onde encomendou, a mensagem colada) e expectativa (tom próximo, três linhas).",
    fix: "" },
  { p: "Até meia página, em tópicos, em português simples. Não inventes números.",
    miss: ["T", "C"],
    why: "Diz como deve ficar e não diz o quê. Meia página sobre quê, e a partir de que informação?",
    fix: "Resume as reclamações de Setembro, que colo a seguir." },
  { p: "Faz o plano de produção de sábado.",
    miss: ["C", "E"],
    why: "A tarefa é clara. Sem as encomendas e os fornos, ele monta um plano arrumado que não serve para a tua cozinha.",
    fix: "Temos 40 encomendas e dois fornos, 6 bolos por fornada. Em tabela, hora a hora." },
  { p: "Temos 40 encomendas para sábado e dois fornos. Cada forno leva 6 bolos por fornada, 50 minutos cada. Faz o plano de produção.",
    miss: ["E"],
    why: "Tem os números. Falta dizer como queres o plano e o que é inegociável, por exemplo a hora a que tudo tem de estar pronto.",
    fix: "Em tabela, hora a hora. Tudo pronto até às 9h. Diz-me o que fazer se um forno falhar." }
];
const KEYS = ["T", "C", "E"];
const NAMES = { T: "Tarefa", C: "Contexto", E: "Expectativa" };

let i = 0, results = [], picked = new Set(), none = false;
const stage = document.getElementById("stage");
const bars = document.getElementById("bars");
const count = document.getElementById("count");
bars.style.gridTemplateColumns = `repeat(${Q.length}, 1fr)`;

function esc(s) { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
function same(a, b) { return a.length === b.length && a.every(x => b.includes(x)); }
function listNames(arr) {
  const n = arr.map(k => NAMES[k].toLowerCase());
  return n.length === 0 ? "nada" : n.length === 1 ? n[0] : n.slice(0, -1).join(", ") + " e " + n[n.length - 1];
}

function drawBars() {
  bars.innerHTML = Q.map((_, k) => {
    let c = "";
    if (results[k] !== undefined) c = results[k] ? "ok" : "ko";
    else if (k === i) c = "now";
    return `<i class="${c}"></i>`;
  }).join("");
  count.textContent = `${Math.min(i + 1, Q.length)} de ${Q.length}`;
}

function show() {
  picked = new Set(); none = false;
  drawBars();
  const q = Q[i];
  stage.innerHTML = `
    <section class="card">
      <div>
        <div class="label">Pedido ${i + 1}</div>
        <p class="prompt">“${esc(q.p)}”</p>
      </div>
      <p class="ask">O que falta?</p>
      <div class="toggles">
        ${KEYS.map(k => `<button class="tog" id="t-${k}" data-k="${k}" aria-pressed="false">${NAMES[k].toUpperCase()}<small>falta</small></button>`).join("")}
        <button class="tog none" id="t-none" aria-pressed="false">NÃO FALTA NADA</button>
      </div>
      <button class="btn" id="confirm" disabled>Confirmar</button>
      <div id="fb" aria-live="polite"></div>
    </section>`;
  stage.querySelectorAll(".tog[data-k]").forEach(b => b.addEventListener("click", () => {
    const k = b.dataset.k;
    picked.has(k) ? picked.delete(k) : picked.add(k);
    none = false;
    sync();
  }));
  document.getElementById("t-none").addEventListener("click", () => { none = !none; if (none) picked.clear(); sync(); });
  document.getElementById("confirm").addEventListener("click", check);
}

function sync() {
  KEYS.forEach(k => document.getElementById("t-" + k).setAttribute("aria-pressed", picked.has(k)));
  document.getElementById("t-none").setAttribute("aria-pressed", none);
  document.getElementById("confirm").disabled = !(none || picked.size);
}

function check() {
  const q = Q[i];
  const mine = KEYS.filter(k => picked.has(k));
  const right = same(mine, q.miss);
  results[i] = right;
  stage.querySelectorAll(".tog").forEach(b => b.disabled = true);
  document.getElementById("confirm").hidden = true;
  const verdict = right ? "Certo." : (q.miss.length ? `Falta ${listNames(q.miss)}.` : "Não falta nada.");
  const last = i === Q.length - 1;
  document.getElementById("fb").innerHTML = `
    <div class="feedback">
      <p class="verdict ${right ? "" : "wrong"}">${verdict}</p>
      <div class="blocks">${KEYS.map(k => {
        const m = q.miss.includes(k);
        return `<div class="block ${m ? "falta" : "tem"}"><b>${NAMES[k].toUpperCase()}</b><span>${m ? "falta" : "tem"}</span></div>`;
      }).join("")}</div>
      ${right ? "" : `<p class="mine">Marcaste: ${mine.length ? listNames(mine) : "não falta nada"}.</p>`}
      <p class="why">${esc(q.why)}</p>
      <div class="fix"><div class="label">${q.fix ? "Para ficar completo, junta" : "Pronto a usar"}</div><p>${q.fix ? "“" + esc(q.fix) + "”" : "Não precisa de mais nada."}</p></div>
      <button class="btn" id="next">${last ? "Ver o resultado" : "Seguinte"}</button>
    </div>`;
  drawBars();
  const next = document.getElementById("next");
  next.addEventListener("click", () => { i++; i < Q.length ? show() : end(); window.scrollTo({ top: 0, behavior: "smooth" }); });
  next.scrollIntoView({ behavior: "smooth", block: "nearest" });
}

function end() {
  drawBars();
  const score = results.filter(Boolean).length;
  const msg = score === Q.length ? "Todos certos. Já vês o que falta num pedido antes de o enviares."
    : score >= 5 ? "Bom resultado. Relê os que falhaste: o bloco que escapa costuma ser sempre o mesmo."
    : "Relê os três blocos no slide e tenta outra vez. Pergunta-te sempre: o que faria um colega novo com este pedido?";
  stage.innerHTML = `
    <section class="card end">
      <div>
        <div class="label">O teu resultado</div>
        <p class="score">${score}<small> / ${Q.length}</small></p>
      </div>
      <p class="end-msg">${msg}</p>
      <ul class="recap">${Q.map((q, k) => `<li><span class="n">${k + 1}</span><span>${esc(q.p.length > 70 ? q.p.slice(0, 68).trim() + "…" : q.p)}<span class="a ${results[k] ? "ok" : "ko"}">Falta: ${listNames(q.miss)}</span></span></li>`).join("")}</ul>
      <button class="btn ghost" id="again">Fazer outra vez</button>
    </section>`;
  document.getElementById("again").addEventListener("click", () => { i = 0; results = []; show(); window.scrollTo({ top: 0 }); });
}

show();
</script>
</body>
</html>
